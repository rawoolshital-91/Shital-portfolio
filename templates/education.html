<section class="education" id="education">
    <style>
        .education {
            position: relative;
            padding: 7rem 2rem;
            background:
                radial-gradient(circle at 18% 22%, rgba(59, 130, 246, 0.14), transparent 30%),
                radial-gradient(circle at 84% 78%, rgba(245, 158, 11, 0.12), transparent 34%),
                linear-gradient(135deg, #f7fffd 0%, #ffffff 45%, #e8f7f3 100%);
            color: #14111f;
            overflow: hidden;
        }

        .education::before {
            content: "";
            position: absolute;
            width: 420px;
            height: 420px;
            left: -170px;
            top: 90px;
            border-radius: 50%;
            background: rgba(59, 130, 246, 0.13);
            filter: blur(75px);
        }

        .education-content {
            position: relative;
            z-index: 2;
            max-width: 1100px;
            margin: 0 auto;
        }

        .education-title {
            font-size: clamp(2.6rem, 5vw, 4rem);
            font-weight: 800;
            color: #14111f;
            margin-bottom: 4rem;
        }

        .education-title::after {
            content: "";
            display: block;
            width: 88px;
            height: 5px;
            border-radius: 999px;
            background: linear-gradient(135deg, #2563eb, #f59e0b);
            margin-top: 16px;
        }

        .education-timeline {
            position: relative;
            display: grid;
            gap: 28px;
        }

        .education-timeline::before {
            content: "";
            position: absolute;
            left: 24px;
            top: 20px;
            bottom: 20px;
            width: 3px;
            border-radius: 999px;
            background: linear-gradient(180deg, #2563eb, rgba(245, 158, 11, 0.25));
        }

        .education-card {
            position: relative;
            display: grid;
            grid-template-columns: 88px 1fr;
            gap: 24px;
            align-items: start;
        }

        .education-year {
            position: relative;
            z-index: 2;
            width: 52px;
            height: 52px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #14111f;
            color: #fff;
            font-size: 0.78rem;
            font-weight: 800;
            box-shadow: 0 16px 34px rgba(20, 91, 86, 0.18);
        }

        .education-box {
            padding: 30px;
            border-radius: 26px;
            background: rgba(255, 255, 255, 0.86);
            border: 1px solid rgba(59, 130, 246, 0.16);
            box-shadow: 0 22px 60px rgba(20, 91, 86, 0.12);
            transition: 0.3s ease;
        }

        .education-box:hover {
            transform: translateY(-6px);
            box-shadow: 0 28px 76px rgba(20, 91, 86, 0.18);
        }

        .education-box span {
            display: inline-block;
            color: #2563eb;
            font-size: 0.85rem;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .education-box h3 {
            font-size: 1.45rem;
            color: #14111f;
            margin-bottom: 10px;
        }

        .education-box p {
            color: #4a4358;
            line-height: 1.7;
            font-size: 1rem;
        }

        @media (max-width: 768px) {
            .education {
                padding: 5.5rem 1.2rem;
            }

            .education-timeline::before {
                left: 18px;
            }

            .education-card {
                grid-template-columns: 64px 1fr;
                gap: 18px;
            }

            .education-year {
                width: 42px;
                height: 42px;
                border-radius: 14px;
                font-size: 0.68rem;
            }

            .education-box {
                padding: 24px;
            }

            .education-box h3 {
                font-size: 1.2rem;
            }
        }
    </style>

    <div class="education-content">
        <h2 class="education-title">Education</h2>

        <div class="education-timeline">
            <div class="education-card">
                <div class="education-year">2016</div>

                <div class="education-box">
                    <span>Bachelor of Engineering</span>
                    <h3>BE in Electronics & Telecommunication (ETC)</h3>
                    <p>
                        Dr. D. Y. Patil College of Engineering, Pune | Score: 59.00%
                    </p>
                </div>
            </div>

            <div class="education-card">
                <div class="education-year">2013</div>

                <div class="education-box">
                    <span>DIPLOMA</span>
                    <h3>Diploma in Electronics & Telecommunication Engineering (E&TC)</h3>
                    <p>
                        Rajendra Mane Polytechnic, Devrukh | Score: 81.71%
                    </p>
                </div>
            </div>
        </div>
    </div>
</section>
